<!DOCTYPE html>
<html>
<head>
<title>Travel Offer</title>
</head>

<body>

<div id="offer"></div>

<script>

const params = new URLSearchParams(window.location.search);
const id = params.get("id");

fetch("/offers/"+id)
.then(r=>r.json())
.then(data=>{

document.getElementById("offer").innerHTML = `
<h1>2L1P Neural Travel</h1>

Client: ${data.clientName}<br>
Destination: ${data.destination}<br>
Price: ${data.price} EUR<br>
Status: ${data.status}<br>

Offer ID: ${data.id}
`;

});

</script>

</body>
</html>
