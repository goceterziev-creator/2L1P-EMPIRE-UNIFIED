<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="container">
    <div class="hero">
      <div>
        <h1>Admin Dashboard</h1>
        <p>Overview of offers, statuses, and revenue potential.</p>
      </div>
      <div class="actions">
        <a class="btn secondary" href="/">Back to App</a>
      </div>
    </div>

    <section class="stats-grid" id="stats"></section>
    <section class="panel">
      <h2>All Offers</h2>
      <table class="table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Destination</th>
            <th>Client</th>
            <th>Price</th>
            <th>Valid Until</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="offersTable"></tbody>
      </table>
    </section>
  </div>
  <script src="/admin.js"></script>
</body>
</html>
