<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2L1P Neural Travel V2</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="container">
    <div class="hero">
      <div>
        <h1>2L1P Neural Travel — MVP v2</h1>
        <p>Create offers, generate PDFs, share client links, and open WhatsApp instantly.</p>
      </div>
      <div class="actions">
        <a class="btn secondary" href="/admin">Open Admin Dashboard</a>
      </div>
    </div>

    <div class="grid">
      <section class="panel form-panel">
        <h2>Create Offer</h2>
        <form id="offerForm">
          <label>Client Name
            <input name="clientName" placeholder="Bibi Client" />
          </label>
          <label>Client Phone
            <input name="clientPhone" placeholder="359888123456" />
          </label>
          <label>Destination *
            <input name="destination" placeholder="Paros, Greece" required />
          </label>
          <label>Flight Route
            <input name="flightRoute" placeholder="Sofia ⇄ Athens ⇄ Paros" />
          </label>
          <label>Hotel
            <input name="hotelName" placeholder="Paros Bay Hotel" />
          </label>
          <div class="row-2">
            <label>Travel Dates
              <input name="travelDates" placeholder="10.03.2026 - 15.03.2026" />
            </label>
            <label>Guests
              <input name="guests" placeholder="2 adults" />
            </label>
          </div>
          <div class="row-2">
            <label>Price *
              <input name="price" type="number" min="1" step="0.01" required />
            </label>
            <label>Currency
              <select name="currency">
                <option value="EUR">EUR</option>
                <option value="BGN">BGN</option>
                <option value="USD">USD</option>
              </select>
            </label>
          </div>
          <div class="row-2">
            <label>Valid for (days)
              <input name="validForDays" type="number" min="1" value="1" />
            </label>
            <label>Custom valid until (optional)
              <input name="validUntil" type="datetime-local" />
            </label>
          </div>
          <label>Notes
            <textarea name="notes" placeholder="Luxury offer with flexible hotel options..."></textarea>
          </label>
          <div class="actions">
            <button type="submit">Save Offer</button>
            <button class="secondary" type="reset">Clear</button>
          </div>
        </form>
      </section>

      <section class="panel list-panel">
        <h2>Recent Offers</h2>
        <div id="offers" class="offer-list"></div>
      </section>
    </div>
  </div>
  <script src="/app.js"></script>
</body>
</html>
