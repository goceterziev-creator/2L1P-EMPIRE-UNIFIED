<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offer Page</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="container">
    <div class="hero">
      <div>
        <h1>Client Offer Page</h1>
        <p>Personal offer view ready to send to the client.</p>
      </div>
      <div class="actions">
        <a class="btn secondary" href="/">Back</a>
      </div>
    </div>

    <section id="offerWrap" class="panel"></section>
  </div>
  <script>
    const offerId = window.location.pathname.split('/').pop();

    function fmtDate(value) {
      return value ? new Date(value).toLocaleString() : '-';
    }

    async function loadOffer() {
      const res = await fetch(`/api/offers/${offerId}`);
      const data = await res.json();
      const wrap = document.getElementById('offerWrap');

      if (!res.ok) {
        wrap.innerHTML = `<p>${data.error || 'Offer not found.'}</p>`;
        return;
      }

      const offer = data.offer;
      const active = new Date(offer.validUntil) >= new Date();

      wrap.innerHTML = `
        <div class="badge ${active ? 'active' : 'expired'}">${active ? 'ACTIVE OFFER' : 'EXPIRED OFFER'}</div>
        <h2>${offer.destination}</h2>
        <p class="muted">Offer ID: ${offer.id}</p>
        <div class="stats-grid">
          <div class="stat-card"><div class="label">Price</div><div class="value">${offer.price} ${offer.currency}</div></div>
          <div class="stat-card"><div class="label">Travel dates</div><div class="value" style="font-size:18px">${offer.travelDates || '-'}</div></div>
          <div class="stat-card"><div class="label">Guests</div><div class="value" style="font-size:18px">${offer.guests || '-'}</div></div>
          <div class="stat-card"><div class="label">Valid until</div><div class="value" style="font-size:18px">${fmtDate(offer.validUntil)}</div></div>
        </div>
        <div class="grid">
          <div class="panel" style="grid-column: span 6; background:#0f1527;">
            <h3>Flights</h3>
            <p>${offer.flightRoute || '-'}</p>
          </div>
          <div class="panel" style="grid-column: span 6; background:#0f1527;">
            <h3>Hotel</h3>
            <p>${offer.hotelName || '-'}</p>
          </div>
          <div class="panel" style="grid-column: span 12; background:#0f1527;">
            <h3>Notes</h3>
            <p>${offer.notes || 'No extra notes.'}</p>
          </div>
        </div>
        <div class="actions" style="margin-top: 20px;">
          <a class="btn" href="/api/offers/${offer.id}/pdf" target="_blank">Download PDF</a>
          <a class="btn secondary" href="/">Back to System</a>
        </div>
      `;
    }

    loadOffer();
  </script>
</body>
</html>
