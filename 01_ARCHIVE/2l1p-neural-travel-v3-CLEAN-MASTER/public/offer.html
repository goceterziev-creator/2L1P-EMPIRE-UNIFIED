<!DOCTYPE html>
<html lang="bg>
<head>
 <meta charset=UTF-8 />
 <meta name=viewport content=width=device-width, initial-scale=1.0 />
 <title>Travel Offer</title>
 <link rel=stylesheet href=/styles.css />
</head>
<body>
 <div class=topbar><div class=container topbar-inner><div><div class=brand-title>2L1P Premium Client View</div><div class=brand-sub>Your personalized travel offer.</div></div><div class=actions><a class=btn secondary href=/>Home</a></div></div></div>
 <div class=container hero id=clientContainer><div class=empty>Loading offer...</div></div>
 <script>
 function pad(n){ return String(n).padStart(2,'0'); }
 function fmtDate(v){ const d=new Date(v); if(isNaN(d)) return v||'-'; return pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.'+d.getFullYear()+' '+pad(d.getHours())+':'+pad(d.getMinutes()); }
 function badge(s){ return `<span class=badge ${s}>${s}</span>`; }
 async function loadOffer(){
 const id=location.pathname.split('/').pop();
 const res=await fetch(`/api/offers/${id}`);
 const data=await res.json();
 const root=document.getElementById('clientContainer');
 if(!data.success){ root.innerHTML=' <div class=empty>Offer not found.</div>'; return; }
 const o=data.offer;
 const hotel=o.hotel||'No hotel selected';
 const notes=o.notes||'No additional notes.';
 const phone=o.clientPhone||'N/A';
 const markup=Number.isFinite(o.markupPct)?o.markupPct:(Number(o.markupPercent)||0);
 const basePrice=Number(o.basePrice||0);
 const finalPrice=Number(o.finalPrice||o.price||0);
 const status=o.effectiveStatus||o.status||'draft';
 root.innerHTML=`<div class=card premium-offer><div class=card-header><div><div class=section-title>Premium Travel Offer</div><div class=muted>Offer ID: ${o.id}</div></div><div>${badge(status)}</div></div><div class=grid-2><div class=card soft><h3>Client</h3><p><strong>Name:</strong> ${o.clientName||'-'}</p><p><strong>Phone:</strong> ${phone}</p></div><div class=card soft><h3>Trip Details</h3><p><strong>Destination:</strong> ${o.destination||'-'}</p><p><strong>Flight Route:</strong> ${o.flightRoute||'-'}</p><p><strong>Hotel:</strong> ${hotel}</p><p><strong>Travel Dates:</strong> ${o.travelDates||'-'}</p><p><strong>Guests:</strong> ${o.guests||'N/A'}</p></div></div><div class=card soft><h3>Pricing</h3><p><strong>Base Price:</strong> ${basePrice} ${o.currency||'EUR'}</p><p><strong>Markup:</strong> ${markup}%</p><p><strong>Final Client Price:</strong> ${finalPrice} ${o.currency||'EUR'}</p><p><strong>Status:</strong> ${status}</p><p><strong>Valid Until:</strong> ${fmtDate(o.validUntil)}</p></div><div class=card soft><h3>Notes</h3><p>${notes}</p></div><div class=card soft><p><strong>Offer ID:</strong> ${o.id}</p><p><strong>Created:</strong> ${fmtDate(o.createdAt)}</p><p><strong>Updated:</strong> ${fmtDate(o.updatedAt)}</p></div></div>`;
 }
 loadOffer();
 </script>
</body>
</html>
